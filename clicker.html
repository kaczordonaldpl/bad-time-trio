<br>
<button id="resetButton">Reset</button>
<br>
<button id="upgradeButton">Kup ulepszenie (+1 punkt za klik) - Koszt: 100</button>
<button id="allInButton">All-in ulepszenia!</button>

<script>
let count = 0;
let pointsPerClick = 1;
let upgradeCost = 100;

const counter = document.getElementById('counter');
const pointsDisplay = document.getElementById('pointsPerClick');
const clickImage = document.getElementById('clickImage');
const resetButton = document.getElementById('resetButton');
const upgradeButton = document.getElementById('upgradeButton');
const allInButton = document.getElementById('allInButton');

function updateDisplay() {
  counter.textContent = count;
  pointsDisplay.textContent = `Punkty za kliknięcie: ${pointsPerClick}`;
  upgradeButton.textContent = `Kup ulepszenie (+1 punkt za klik) - Koszt: ${upgradeCost}`;
}

// Klikanie obrazkiem
clickImage.addEventListener('click', () => {
  count += pointsPerClick;
  updateDisplay();

  // Rickroll po 1000 punktach
  if (count >= 1000) {
    window.location.href = "https://youtu.be/dQw4w9WgXcQ?list=RDdQw4w9WgXcQ";
  }
});

// Reset
resetButton.addEventListener('click', () => {
  count = 0;
  pointsPerClick = 1;
  upgradeCost = 100;
  updateDisplay();
});

// Standardowe ulepszenie
upgradeButton.addEventListener('click', () => {
  if(count >= upgradeCost){
    count -= upgradeCost;
    pointsPerClick += 1;
    upgradeCost += 100;
    updateDisplay();
  } else {
    alert("Nie masz wystarczająco punktów!");
  }
});

// All-in upgrade
allInButton.addEventListener('click', () => {
  let upgradesBought = 0;
  while(count >= upgradeCost) {
    count -= upgradeCost;
    pointsPerClick += 1;
    upgradeCost += 100;
    upgradesBought++;
  }
  if(upgradesBought > 0) {
    updateDisplay();
    alert(`Kupiono ${upgradesBought} ulepszeń!`);
  } else {
    alert("Nie masz wystarczająco punktów!");
  }
});
</script>

</body>
</html>
